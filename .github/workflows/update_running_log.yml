name: Update Running Log

on:
  schedule:
    # Runs daily at 8:00 AM UTC (2:00 AM MDT / 1:00 AM MST)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger the script manually from the GitHub UI for testing

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Get R library path
        run: echo "R_LIBS_USER=$(Rscript -e 'cat(.libPaths()[1])')" >> $GITHUB_ENV

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-packages-${{ hashFiles('running.R') }}
          restore-keys: |
            ${{ runner.os }}-r-packages-

      - name: Install dependencies
        run: |
          needed <- c("dplyr", "ggplot2", "tidyr", "forcats", "tibble", "lubridate", "hms", "mgcv", "googlesheets4", "googledrive", "modelsummary", "tinytable", "broom")
          missing <- needed[!(needed %in% installed.packages()[,"Package"])]
          if(length(missing)) install.packages(missing)
        shell: Rscript {0}

      - name: Authenticate and Run Script
        env:
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
        run: |
          # Write the secure secret to a temporary file for the R script to read
          echo "$GOOGLE_AUTH_JSON" > google_auth.json
          Rscript running.R